<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus Gastos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <!-- TELA DE LOGIN / CADASTRO -->
  <main id="tela-auth" class="app auth" hidden>
    <h1>Meus gastos</h1>
    <p class="sub">Entre ou crie sua conta para ver seus lançamentos.</p>
    <section class="bloco">
      <div class="abas" role="tablist">
        <button type="button" role="tab" data-modo="entrar" aria-selected="true">Entrar</button>
        <button type="button" role="tab" data-modo="criar" aria-selected="false">Criar conta</button>
      </div>
      <form id="form-auth">
        <input type="email" id="email" placeholder="E-mail" autocomplete="email" required>
        <input type="password" id="senha" placeholder="Senha (mínimo 6 caracteres)" minlength="6" autocomplete="current-password" required>
        
        <!-- CAMPOS ADICIONADOS AQUI: -->
        <input type="password" id="confirmar-senha" placeholder="Confirmar senha" minlength="6" autocomplete="new-password" hidden>
        <button type="button" id="esqueci-senha" class="link">Esqueci minha senha</button>
        
        <p id="auth-erro" class="erro" role="alert"></p>
        <button type="submit" id="auth-botao">Entrar</button>
      </form>
    </section>
  </main>
 
  <!-- APLICATIVO (só aparece logado) — navegação por ABAS (Tab) -->
  <main id="tela-app" class="app" hidden>
    <header class="topo">
      <h1>Meus gastos</h1>
      <div class="usuario">
        <span id="usuario-email"></span>
        <button type="button" id="sair" class="remover">Sair</button>
      </div>
    </header>
 
    <p id="aviso" class="erro" role="alert"></p>
 
    <div id="mes-linha" class="mes-linha">
      <label>
        <span class="sr">Mês</span>
        <input type="month" id="mes">
      </label>
    </div>
 
    <!-- TELA 1: DASHBOARD -->
    <section id="painel-dashboard" class="painel" role="tabpanel" aria-labelledby="aba-dashboard">
      <section class="resumo" aria-label="Resumo do mês">
        <div class="saldo">
          <span>Saldo do mês</span>
          <strong id="saldo">R$ 0,00</strong>
        </div>
        <div class="par">
          <div><span>Receitas</span><strong id="receitas" class="pos">R$ 0,00</strong></div>
          <div><span>Despesas</span><strong id="despesas" class="neg">R$ 0,00</strong></div>
        </div>
      </section>
 
      <section class="bloco">
        <h2>Despesas por categoria</h2>
        <div id="resumo-cat" class="categorias"></div>
      </section>
    </section>
 
    <!-- TELA 2: ADICIONAR / LANÇAMENTOS (CRUD 1 — criar) -->
    <section id="painel-adicionar" class="painel" role="tabpanel" aria-labelledby="aba-adicionar" hidden>
      <section class="bloco">
        <h2>Novo lançamento</h2>
        <form id="form-lanc">
          <div class="tipo" role="radiogroup" aria-label="Tipo">
            <label><input type="radio" name="tipo" value="despesa" checked><span>Despesa</span></label>
            <label><input type="radio" name="tipo" value="receita"><span>Receita</span></label>
          </div>
          <input type="text" id="descricao" placeholder="Descrição (ex.: mercado)" maxlength="60" required>
          <div class="linha">
            <input type="number" id="valor" placeholder="Valor (R$)" min="0.01" step="0.01" required>
            <input type="date" id="data" required>
          </div>
          <select id="categoria" aria-label="Categoria" required></select>
          <button type="submit">Adicionar lançamento</button>
        </form>
      </section>
    </section>
 
    <!-- TELA 3: HISTÓRICO (CRUD 1 — listar e excluir) -->
    <section id="painel-historico" class="painel" role="tabpanel" aria-labelledby="aba-historico" hidden>
      <section class="bloco">
        <h2>Lançamentos do mês</h2>
        <ul id="lista-lanc" class="lista"></ul>
      </section>
    </section>
 
    <!-- TELA 4: GERENCIAMENTO DE CATEGORIAS (CRUD 2) -->
    <section id="painel-categorias" class="painel" role="tabpanel" aria-labelledby="aba-categorias" hidden>
      <section class="bloco">
        <h2>Minhas categorias</h2>
        <form id="form-cat">
          <div class="linha">
            <input type="text" id="cat-nome" placeholder="Nome da categoria" maxlength="30" required>
            <select id="cat-tipo" aria-label="Tipo da categoria">
              <option value="despesa">Despesa</option>
              <option value="receita">Receita</option>
            </select>
          </div>
          <button type="submit">Adicionar categoria</button>
        </form>
        <ul id="lista-cat" class="lista"></ul>
      </section>
    </section>
 
    <!-- BARRA DE ABAS (Tab Navigation) -->
    <nav id="tabbar" class="tabbar" role="tablist" aria-label="Navegação principal">
      <button type="button" role="tab" id="aba-dashboard" data-aba="dashboard" aria-controls="painel-dashboard" aria-selected="true"><span class="ico" aria-hidden="true">📊</span>Dashboard</button>
      <button type="button" role="tab" id="aba-adicionar" data-aba="adicionar" aria-controls="painel-adicionar" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">➕</span>Adicionar</button>
      <button type="button" role="tab" id="aba-historico" data-aba="historico" aria-controls="painel-historico" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">🧾</span>Histórico</button>
      <button type="button" role="tab" id="aba-categorias" data-aba="categorias" aria-controls="painel-categorias" aria-selected="false" tabindex="-1"><span class="ico" aria-hidden="true">🏷️</span>Categorias</button>
    </nav>
  </main>
 
  <script type="module" src="script.js"></script>
</body>
</html>
